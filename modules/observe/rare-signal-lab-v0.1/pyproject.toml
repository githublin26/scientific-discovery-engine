[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-signal-lab"
version = "0.1.0"
description = "Synthetic semiconductor early-warning research benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rare-signal = "rare_signal.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
